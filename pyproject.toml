[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "benchtrack"
version = "0.1.0"
description = "Workshop inventory and maintenance management system."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162,<1.0",
    "uvicorn>=0.54,<1.0",
    "SQLAlchemy>=2.1,<3.0",
    "alembic>=1.20,<2.0",
    "pydantic>=2.14,<3.0",
    "Jinja2>=3.1,<4.0",
    "scalar-fastapi>=1.9,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2,<10.0",
    "httpx2>=2.0,<3.0",
    "ruff>=0.17,<1.0",
]

[tool.setuptools.packages.find]
include = ["app", "app.*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-ignore = ["B008"]